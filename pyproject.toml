[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chromiq"
version = "1.0.0"
description = "Public color utility platform and REST API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pillow>=10.4,<12", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=120
target-version="py311"

[tool.mypy]
python_version="3.11"
ignore_missing_imports=true
check_untyped_defs=true
warn_unused_ignores=true
